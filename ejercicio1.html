<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - JavaScript</title>
</head>
<body>

    <h2>Actualizar contenido con un clic</h2>

    <p id="mensaje"></p>

    <button onclick="cambiarTexto()">Haz clic aquí</button>

    <script>
        function cambiarTexto() {
            document.getElementById("mensaje").innerHTML = "¡Texto actualizado con Javascript!";
        }
    </script>

</body>
</html>
